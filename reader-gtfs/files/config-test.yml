graphhopper:
  datareader.file: reader-gtfs/files/beatty.osm
  gtfs.file: reader-gtfs/files/sample-feed,reader-gtfs/files/another-sample-feed
  graph.location: graphs/beatty

  profiles:
    - name: foot
      vehicle: foot
      weighting: fastest
    - name: car
      vehicle: car
      weighting: fastest

server:
  port: 8989
  # for security reasons bind to localhost
  address: localhost
management:
  server:
    port: 8990
    address: localhost

logging:
  # level.root: DEBUG
  # file.name: logs/graphhopper.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS,UTC} [%thread] %-5level %logger{36} - %msg%n"
